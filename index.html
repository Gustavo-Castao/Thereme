<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Theremin Etéreo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090a16;
      color: #a8b2d1;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #pad {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: none;
      background: radial-gradient(circle at center, #161b33 0%, #090a16 100%);
    }

    #texto-ayuda {
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    #btn-iniciar {
      margin-top: 15px;
      padding: 18px 36px;
      font-size: 18px;
      font-weight: bold;
      color: #090a16;
      background-color: #64ffda;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(100, 255, 218, 0.4);
      z-index: 10;
    }

    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      color: #64ffda;
      pointer-events: none;
      text-align: center;
    }

    #luz {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(100, 255, 218, 0.75);
      box-shadow: 0 0 35px 15px rgba(100, 255, 218, 0.35);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>

  <div id="pad">
    <div id="texto-ayuda">
      <h2>Theremin Etéreo</h2>
      <p id="instruccion">Pulsa el botón para activar el sonido</p>
    </div>
    <button id="btn-iniciar">Activar Sonido</button>
    <div id="luz"></div>
  </div>

  <div id="debug">Esperando botón...</div>

  <script>
    const pad = document.getElementById("pad");
    const luz = document.getElementById("luz");
    const btnIniciar = document.getElementById("btn-iniciar");
    const instruccion = document.getElementById("instruccion");
    const debug = document.getElementById("debug");

    let sinte, filtro, eco, reverb, limitador;
    let audioListo = false;
    let tocando = false;
    let notaActual = "";

    const notas = [
      "C3", "Eb3", "F3", "G3", "Bb3",
      "C4", "Eb4", "F4", "G4", "Bb4",
      "C5", "Eb5", "F5", "G5", "Bb5", "C6"
    ];

    btnIniciar.addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        await Tone.start();
        await Tone.context.resume();

        if (!sinte) {
          sinte = new Tone.Synth({
            volume: -6, // Volumen equilibrado para no saturar
            oscillator: {
              type: "fattriangle",
              count: 3,
              spread: 20
            },
            envelope: {
              attack: 0.25,
              decay: 0.5,
              sustain: 0.8,
              release: 2.2
            },
            portamento: 0.12
          });

          filtro = new Tone.Filter(1000, "lowpass");

          eco = new Tone.PingPongDelay({
            delayTime: "8n.",
            feedback: 0.45,
            wet: 0.35
          });

          // Usamos JCReverb (compatible con todos los celus) pero suavizada al 35%
          reverb = new Tone.JCReverb(0.45);
          reverb.wet.value = 0.35;

          limitador = new Tone.Limiter(-3);

          sinte.chain(filtro, eco, reverb, limitador, Tone.Destination);
        }

        // Nota suave de confirmación
        sinte.triggerAttackRelease("C4", 0.3);

        audioListo = true;
        btnIniciar.style.display = "none";
        instruccion.textContent = "Desliza el dedo (Izq/Der = Nota | Arriba/Abajo = Brillo)";
        debug.textContent = "Audio: " + Tone.context.state + " | Listo para tocar";
      } catch (err) {
        debug.textContent = "ERROR: " + err.message;
      }
    });

    function actualizarSonido(x, y) {
      if (!audioListo) return;

      const porcentajeX = Math.max(0, Math.min(1, x / window.innerWidth));
      const porcentajeY = Math.max(0, Math.min(1, 1 - (y / window.innerHeight)));

      const indice = Math.floor(porcentajeX * (notas.length - 1));
      const nuevaNota = notas[indice];

      if (nuevaNota !== notaActual) {
        if (!tocando) {
          sinte.triggerAttack(nuevaNota);
        } else {
          sinte.setNote(nuevaNota);
        }
        notaActual = nuevaNota;
      }

      const frecuenciaFiltro = 250 + (porcentajeY * 2400);
      filtro.frequency.rampTo(frecuenciaFiltro, 0.05);

      luz.style.left = x + "px";
      luz.style.top = y + "px";
      debug.textContent = `Nota: ${notaActual} | Brillo: ${Math.round(frecuenciaFiltro)} Hz`;
    }

    pad.addEventListener("pointerdown", (e) => {
      if (!audioListo) return;
      document.getElementById("texto-ayuda").style.opacity = "0.25";
      luz.style.display = "block";
      actualizarSonido(e.clientX, e.clientY);
      tocando = true;
    });

    pad.addEventListener("pointermove", (e) => {
      if (!audioListo || !tocando) return;
      actualizarSonido(e.clientX, e.clientY);
    });

    function detener() {
      if (!tocando) return;
      tocando = false;
      notaActual = "";
      sinte.triggerRelease();
      luz.style.display = "none";
      debug.textContent = "En pausa (desliza para tocar)";
    }

    pad.addEventListener("pointerup", detener);
    pad.addEventListener("pointerleave", detener);
    pad.addEventListener("pointercancel", detener);
  </script>
</body>
</html>
