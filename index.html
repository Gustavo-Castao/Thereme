<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Theremin Etéreo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090a16;
      color: #a8b2d1;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #pad {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: none;
      background: radial-gradient(circle at center, #161b33 0%, #090a16 100%);
    }

    #texto-ayuda {
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    #btn-iniciar {
      margin-top: 15px;
      padding: 18px 36px;
      font-size: 18px;
      font-weight: bold;
      color: #090a16;
      background-color: #64ffda;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(100, 255, 218, 0.4);
      z-index: 10;
    }

    #debug {
      margin-top: 25px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
      color: #64ffda;
      pointer-events: none;
      text-align: center;
      max-width: 85vw;
    }

    #luz {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(100, 255, 218, 0.8);
      box-shadow: 0 0 30px 15px rgba(100, 255, 218, 0.4);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>

  <div id="pad">
    <div id="texto-ayuda">
      <h2>Theremin Etéreo</h2>
      <p id="instruccion">Sube el volumen multimedia y quita el silencio físico (si es iPhone)</p>
    </div>
    <button id="btn-iniciar">Activar Sonido</button>
    <div id="debug">Estado: Esperando botón...</div>
    <div id="luz"></div>
  </div>

  <script>
    const pad = document.getElementById("pad");
    const luz = document.getElementById("luz");
    const btnIniciar = document.getElementById("btn-iniciar");
    const instruccion = document.getElementById("instruccion");
    const debug = document.getElementById("debug");

    let sinte, filtro, eco, reverb;
    let audioListo = false;
    let tocando = false;
    let notaActual = "";

    const notas = [
      "C3", "Eb3", "F3", "G3", "Bb3",
      "C4", "Eb4", "F4", "G4", "Bb4",
      "C5", "Eb5", "F5", "G5", "Bb5", "C6"
    ];

    function actualizarDebug(extra = "") {
      const estadoAudio = typeof Tone !== "undefined" ? Tone.context.state : "Sin Tone.js";
      debug.textContent = `Audio: ${estadoAudio} | Tocando: ${tocando ? "SÍ" : "NO"} | Nota: ${notaActual || "-"} ${extra}`;
    }

    if (typeof Tone === "undefined") {
      debug.textContent = "ERROR: No cargó Tone.js. Revisa tu conexión.";
      btnIniciar.style.display = "none";
    }

    btnIniciar.addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        await Tone.start();
        await Tone.context.resume();

        if (!sinte) {
          sinte = new Tone.Synth({
            oscillator: { type: "fattriangle", count: 3, spread: 25 },
            envelope: { attack: 0.2, decay: 0.5, sustain: 0.8, release: 2.0 },
            portamento: 0.12
          });

          filtro = new Tone.Filter(1200, "lowpass");
          eco = new Tone.PingPongDelay({ delayTime: "8n.", feedback: 0.5, wet: 0.35 });
          reverb = new Tone.JCReverb(0.75);

          sinte.chain(filtro, eco, reverb, Tone.Destination);
        }

        // 0.4 como número (sin comillas)
        sinte.triggerAttackRelease("C4", 0.4);

        audioListo = true;
        btnIniciar.style.display = "none";
        instruccion.textContent = "¡Desliza el dedo por la pantalla!";
        actualizarDebug("| Prueba enviada");
      } catch (err) {
        debug.textContent = "ERROR: " + err.message;
      }
    });

    function actualizarSonido(x, y) {
      if (!audioListo) return;

      const porcentajeX = Math.max(0, Math.min(1, x / window.innerWidth));
      const porcentajeY = Math.max(0, Math.min(1, 1 - (y / window.innerHeight)));

      const indice = Math.floor(porcentajeX * (notas.length - 1));
      const nuevaNota = notas[indice];

      if (nuevaNota !== notaActual) {
        if (!tocando) {
          sinte.triggerAttack(nuevaNota);
        } else {
          sinte.setNote(nuevaNota);
        }
        notaActual = nuevaNota;
      }

      const frecuenciaFiltro = 250 + (porcentajeY * 3500);
      filtro.frequency.rampTo(frecuenciaFiltro, 0.05);

      luz.style.left = x + "px";
      luz.style.top = y + "px";
      actualizarDebug();
    }

    pad.addEventListener("pointerdown", (e) => {
      if (!audioListo) return;
      luz.style.display = "block";
      actualizarSonido(e.clientX, e.clientY);
      tocando = true;
      actualizarDebug();
    });

    pad.addEventListener("pointermove", (e) => {
      if (!audioListo || !tocando) return;
      actualizarSonido(e.clientX, e.clientY);
    });

    function detener(e) {
      if (!tocando) return;
      tocando = false;
      notaActual = "";
      sinte.triggerRelease();
      luz.style.display = "none";
      actualizarDebug(`| Soltado`);
    }

    pad.addEventListener("pointerup", detener);
    pad.addEventListener("pointerleave", detener);
    pad.addEventListener("pointercancel", detener);
  </script>
</body>
</html>
