<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Theremin Etéreo</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090a16;
      color: #a8b2d1;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #pad {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      touch-action: none;
      background: radial-gradient(circle at center, #161b33 0%, #090a16 100%);
    }

    #texto-ayuda {
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    #btn-iniciar {
      margin-top: 20px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #090a16;
      background-color: #64ffda;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(100, 255, 218, 0.4);
    }

    #estado {
      margin-top: 15px;
      font-size: 14px;
      color: #ff7b72;
      text-align: center;
      padding: 0 20px;
    }

    #luz {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(100, 255, 218, 0.8);
      box-shadow: 0 0 30px 15px rgba(100, 255, 218, 0.4);
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>

  <div id="pad">
    <div id="texto-ayuda">
      <h2>Theremin Etéreo</h2>
      <p id="instruccion">Pulsa el botón para activar el sonido</p>
    </div>
    <button id="btn-iniciar">Activar Sonido</button>
    <div id="estado"></div>
    <div id="luz"></div>
  </div>

  <script>
    const pad = document.getElementById("pad");
    const luz = document.getElementById("luz");
    const btnIniciar = document.getElementById("btn-iniciar");
    const instruccion = document.getElementById("instruccion");
    const estado = document.getElementById("estado");

    let sinte, filtro, eco, reverb;
    let audioListo = false;
    let tocando = false;
    let notaActual = "";

    const notas = [
      "C3", "Eb3", "F3", "G3", "Bb3",
      "C4", "Eb4", "F4", "G4", "Bb4",
      "C5", "Eb5", "F5", "G5", "Bb5", "C6"
    ];

    // Verificamos si el celular dejó cargar Tone.js
    if (typeof Tone === "undefined") {
      estado.textContent = "Error: No se pudo cargar el motor de audio (Tone.js). Abre este archivo desde Chrome/Safari con internet, no desde un visor de archivos.";
      btnIniciar.style.display = "none";
    }

    // 1. Botón explícito para desbloquear el audio en celulares
    btnIniciar.addEventListener("click", async (e) => {
      e.stopPropagation(); // Evita que dispare otros eventos del pad
      try {
        btnIniciar.textContent = "Cargando...";
        await Tone.start();
        await Tone.context.resume();

        if (!sinte) {
          sinte = new Tone.Synth({
            oscillator: { type: "fattriangle", count: 3, spread: 25 },
            envelope: { attack: 0.4, decay: 0.5, sustain: 0.8, release: 2.5 },
            portamento: 0.12
          });

          filtro = new Tone.Filter(800, "lowpass");
          eco = new Tone.PingPongDelay({ delayTime: "8n.", feedback: 0.55, wet: 0.4 });
          reverb = new Tone.Reverb({ decay: 5, wet: 0.6 });
          await reverb.ready;

          sinte.chain(filtro, eco, reverb, Tone.Destination);
        }

        audioListo = true;
        btnIniciar.style.display = "none";
        estado.textContent = "";
        instruccion.innerHTML = "¡Listo! Desliza el dedo por la pantalla.<br>(Si usas iPhone, quita el modo silencio físico)";
      } catch (err) {
        estado.textContent = "Error al iniciar audio: " + err.message;
      }
    });

    function actualizarSonido(x, y) {
      if (!audioListo) return;

      const porcentajeX = Math.max(0, Math.min(1, x / window.innerWidth));
      const porcentajeY = Math.max(0, Math.min(1, 1 - (y / window.innerHeight)));

      const indice = Math.floor(porcentajeX * (notas.length - 1));
      const nuevaNota = notas[indice];

      if (nuevaNota !== notaActual) {
        if (!tocando) {
          sinte.triggerAttack(nuevaNota);
        } else {
          sinte.setNote(nuevaNota);
        }
        notaActual = nuevaNota;
      }

      const frecuenciaFiltro = 200 + (porcentajeY * 3300);
      filtro.frequency.rampTo(frecuenciaFiltro, 0.05);

      luz.style.left = x + "px";
      luz.style.top = y + "px";
    }

    pad.addEventListener("pointerdown", (e) => {
      if (!audioListo) return;
      document.getElementById("texto-ayuda").style.opacity = "0.2";
      luz.style.display = "block";
      actualizarSonido(e.clientX, e.clientY);
      tocando = true;
    });

    pad.addEventListener("pointermove", (e) => {
      if (!audioListo || !tocando) return;
      actualizarSonido(e.clientX, e.clientY);
    });

    function detener() {
      if (!tocando) return;
      tocando = false;
      notaActual = "";
      sinte.triggerRelease();
      luz.style.display = "none";
    }

    pad.addEventListener("pointerup", detener);
    pad.addEventListener("pointerleave", detener);
    pad.addEventListener("pointercancel", detener);
  </script>
</body>
</html>
