<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Theremin con Cámara</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #090a16;
      color: #a8b2d1;
      font-family: sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.25;
      z-index: 1;
      display: none;
    }

    #ui {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #btn-iniciar {
      margin-top: 20px;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: bold;
      color: #090a16;
      background-color: #64ffda;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(100, 255, 218, 0.4);
      pointer-events: auto;
    }

    #debug {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-family: monospace;
      color: #64ffda;
      text-align: center;
      pointer-events: none;
    }

    #luz {
      position: fixed;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(100, 255, 218, 0.85);
      box-shadow: 0 0 35px 15px rgba(100, 255, 218, 0.45);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      display: none;
    }
  </style>
</head>
<body>

  <video id="video" playsinline muted autoplay></video>
  <div id="luz"></div>

  <div id="ui">
    <h2 id="titulo">Theremin Etéreo</h2>
    <p id="instruccion">Controla el sonido moviendo tu mano frente a la cámara</p>
    <button id="btn-iniciar">Activar Cámara y Sonido</button>
  </div>

  <div id="debug">Esperando que pulses el botón...</div>

  <script>
    const video = document.getElementById("video");
    const luz = document.getElementById("luz");
    const btnIniciar = document.getElementById("btn-iniciar");
    const instruccion = document.getElementById("instruccion");
    const titulo = document.getElementById("titulo");
    const debug = document.getElementById("debug");

    let sinte, filtro, eco, reverb, limitador;
    let tocando = false;
    let notaActual = "";
    let ultimoTiempoConMano = 0;
    let modeloListo = false;

    const notas = [
      "C3", "Eb3", "F3", "G3", "Bb3",
      "C4", "Eb4", "F4", "G4", "Bb4",
      "C5", "Eb5", "F5", "G5", "Bb5", "C6"
    ];

    // --- 1. CONFIGURAR EL SINTETIZADOR ---
    function iniciarAudio() {
      if (sinte) return;
      sinte = new Tone.Synth({
        volume: -10,
        oscillator: { type: "fattriangle", count: 2, spread: 18 },
        envelope: { attack: 0.3, decay: 0.5, sustain: 0.8, release: 2.2 },
        portamento: 0.16
      });

      filtro = new Tone.Filter(1000, "lowpass");
      eco = new Tone.PingPongDelay({ delayTime: "8n.", feedback: 0.45, wet: 0.35 });
      reverb = new Tone.JCReverb(0.4);
      reverb.wet.value = 0.3;
      limitador = new Tone.Limiter(-4);

      sinte.chain(filtro, eco, reverb, limitador, Tone.Destination);
    }

    function actualizarSonido(xNorm, yNorm) {
      const indice = Math.min(notas.length - 1, Math.floor(xNorm * notas.length));
      const nuevaNota = notas[indice];

      if (nuevaNota !== notaActual) {
        if (!tocando) {
          sinte.triggerAttack(nuevaNota);
        } else {
          sinte.setNote(nuevaNota);
        }
        notaActual = nuevaNota;
      }

      const frecuenciaFiltro = 250 + (yNorm * 2300);
      filtro.frequency.rampTo(frecuenciaFiltro, 0.08);

      luz.style.display = "block";
      luz.style.left = (xNorm * window.innerWidth) + "px";
      luz.style.top = ((1 - yNorm) * window.innerHeight) + "px";

      debug.textContent = `Mano detectada | Nota: ${notaActual} | Brillo: ${Math.round(frecuenciaFiltro)} Hz`;
    }

    function detenerSonido() {
      if (!tocando) return;
      tocando = false;
      notaActual = "";
      sinte.triggerRelease();
      luz.style.display = "none";
      debug.textContent = "Muestra tu mano frente a la cámara para tocar";
    }

    // --- 2. CONFIGURAR DETECTOR DE MANOS (MediaPipe) ---
    let hands;
    function iniciarMediaPipe() {
      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (!modeloListo) {
          modeloListo = true;
          debug.textContent = "¡Listo! Muestra tu mano frente a la cámara";
        }

        const ahora = performance.now();

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          ultimoTiempoConMano = ahora;
          const dedo = results.multiHandLandmarks[0][8];

          const xNorm = Math.max(0, Math.min(1, 1 - dedo.x));
          const yNorm = Math.max(0, Math.min(1, 1 - dedo.y));

          actualizarSonido(xNorm, yNorm);
          tocando = true;
        } else {
          if (tocando && (ahora - ultimoTiempoConMano > 350)) {
            detenerSonido();
          }
        }
      });
    }

    // --- 3. BUCLE DE VIDEO CON RESPIRO DE 100ms PARA EL CELU ---
    async function bucleCamara() {
      if (video.readyState >= 2) {
        try {
          await hands.send({ image: video });
        } catch (err) {
          debug.textContent = "Error detectando mano: " + err.message;
        }
      }
      setTimeout(bucleCamara, 100);
    }

    // --- 4. BOTÓN DE INICIO ---
    btnIniciar.addEventListener("click", async () => {
      try {
        btnIniciar.disabled = true;
        btnIniciar.textContent = "Iniciando...";
        debug.textContent = "Activando audio y pidiendo permiso de cámara...";

        await Tone.start();
        await Tone.context.resume();
        iniciarAudio();
        sinte.triggerAttackRelease("C4", 0.25);

        if (typeof Hands === "undefined") {
          throw new Error("No se cargó la librería MediaPipe Hands.");
        }

        iniciarMediaPipe();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 240 },
            height: { ideal: 180 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";
        await video.play();

        btnIniciar.style.display = "none";
        titulo.style.opacity = "0.25";
        instruccion.style.opacity = "0.25";
        instruccion.textContent = "Mueve tu dedo índice en el aire";
        debug.textContent = "Cargando inteligencia artificial (espera unos segundos)...";

        bucleCamara();
      } catch (err) {
        btnIniciar.disabled = false;
        btnIniciar.textContent = "Reintentar";
        debug.textContent = "ERROR: " + err.message;
      }
    });
  </script>
</body>
</html>
